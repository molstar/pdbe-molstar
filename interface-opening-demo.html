<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>PDBe Molstar</title>

    <!-- Molstar CSS & JS -->
    <link rel="stylesheet" type="text/css" href="./build/pdbe-molstar-light.css">
    <script type="text/javascript" src="./build/pdbe-molstar-plugin.js"></script>

    <style>
        body {
            padding: 30px;
        }

        #myViewer {
            width: 450px;
            height: 450px;
            position: relative;
            margin-top: 100px;
            margin-right: 20px;
        }

        .spinner_aj0A {
            transform-origin: center;
            animation: spinner_KYSC .75s infinite linear
        }

        @keyframes spinner_KYSC {
            100% {
                transform: rotate(360deg)
            }
        }
    </style>
</head>

<body>
    <h3>PDBe Mol* JS Plugin Demo</h3>
    <div class="viewerSection" style="display: flex; flex-direction: row;">
        <!-- Molstar container -->
        <div id="myViewer"></div>
        <div style="display: block;">
            <h4>Interface animation:</h4>
            <div>
                <input type="radio" name="opening" id="close" onclick="closeInterface()" checked /><label for="close">Close interface</label>
                <input type="radio" name="opening" id="open" onclick="openInterface()" /><label for="open">Open interface</label>
            </div>
        </div>

    </div>

    <script>
        function getJsonParam(paramName) {
            const paramString = new URL(window.location).searchParams.get(paramName);
            const param = JSON.parse(paramString);
            return param ?? undefined;
        }

        function getParams(defaults) {
            const searchParams = new URL(window.location).searchParams;
            const out = {};
            for (const key in defaults) {
                out[key] = searchParams.get(key);
            }
            if (Object.values(out).every(value => value !== null)) {
                return out;
            } else {
                const newUrl = new URL(window.location);
                newUrl.search = '';
                for (const key in defaults) {
                    newUrl.searchParams.set(key, out[key] ?? defaults[key]);
                }
                window.location = newUrl;
            }
        }

        async function main() {
            const { pdb_id, assembly_id, label_asym_id_1, label_asym_id_2 } = getParams({
                // Defaults:
                pdb_id: '1hda',
                assembly_id: '',
                label_asym_id_1: 'A',
                label_asym_id_2: 'B',
            });

            // Create plugin instance
            const viewerInstance = new PDBeMolstarPlugin();
            const viewerContainer = document.getElementById('myViewer');

            const defaultOptions = {
                bgColor: 'white',
                alphafoldView: true,
                sequencePanel: true,
                // hideControls: true,
                // expanded: true,
                // visualStyle: {
                //     polymer: { type: 'putty', size: 'uniform' },
                //     het: 'ball-and-stick',
                //     nonStandard: 'ball-and-stick',
                //     carbs: 'carbohydrate',
                // },
                hideStructure: ['water'],
            };
            const options = { ...defaultOptions, ...getJsonParam('options') };

            // Call render method to display the 3D view
            await viewerInstance.render(viewerContainer, options);

            console.log('Params:', pdb_id, assembly_id, label_asym_id_1, label_asym_id_2);

            await PDBeMolstarPlugin.extensions.InterfaceOpening.runInterfaceOpening(
                viewerInstance.plugin,
                pdb_id,
                assembly_id,
                [{ label_asym_id: label_asym_id_1 }],
                [{ label_asym_id: label_asym_id_2 }],
            );
        }

        main();
    </script>

</body>

</html>
